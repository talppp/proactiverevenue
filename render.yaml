# Render Blueprint — free-tier L1-only deploy.
# Apply via Render dashboard → New + → Blueprint → pick this repo.
#
# This file declares ONLY the L1 SMS-phone service so the Blueprint
# apply flow asks for just one set of env vars. The full-pipeline
# service and P0 cron are kept commented out at the bottom — uncomment
# them once the L2-L6 modules from the Drive project are in this repo.

services:
  - type: web
    name: apteker-router-l1
    runtime: docker
    plan: free                # 750 free-tier hours/month, cold-starts after 15m idle
    region: oregon
    autoDeploy: true
    branch: claude/open-nathalie-project-IT0ZA
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DB_URL
        value: memory         # swap for free Neon/Supabase Postgres for persistence
      - key: SMS_BEARER_TOKEN_PRIMARY
        sync: false           # set in Render dashboard during Blueprint apply
      - key: SMS_BEARER_TOKEN_SECONDARY
        sync: false           # optional; leave blank until first token rotation
      - key: ADMIN_BEARER_TOKEN
        sync: false
      - key: SMS_POLL_INTERVAL_SECONDS
        value: "30"
      - key: SMS_STUCK_THRESHOLD_SECONDS
        value: "30"
      - key: SMS_POLL_MAX_ATTEMPTS
        value: "5"
      - key: LOG_LEVEL
        value: INFO

