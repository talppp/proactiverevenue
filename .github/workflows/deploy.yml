name: deploy

on:
  push:
    branches: [main]

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    if: github.repository_owner != ''   # never auto-trigger from forks
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL secret configured - skipping."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy hook fired."

  apply-migrations:
    runs-on: ubuntu-latest
    needs: trigger-render
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply schema.sql to production
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "No PROD_DATABASE_URL secret - skipping migration."
            exit 0
          fi
          pip install "psycopg[binary]"
          python -c "
          import os, psycopg, pathlib
          with psycopg.connect(os.environ['PROD_DATABASE_URL'], autocommit=True) as c:
              c.execute(pathlib.Path('08_Review_Schema_Plan/02_schema.sql').read_text())
          print('schema applied')
          "
