# Render Blueprint - infra-as-code for the AI Issue Router service.
# Apply with: render blueprint apply --file render.yaml
# Adjust DATABASE plan to "starter" ($7/mo) once the demo period ends.

services:
  - type: web
    name: apteker-router
    runtime: python
    plan: starter            # $7/mo; bump to standard if traffic warrants
    region: oregon
    autoDeploy: true
    branch: main
    buildCommand: "pip install -e ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: DB_URL
        fromDatabase:
          name: apteker-router-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false           # set via Render dashboard, never in source
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: CONFIDENCE_FLOOR
        value: "0.55"
      - key: LLM_DAILY_USD_CEILING
        value: "10.0"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Cron worker for P0 escalation timers.
  # Runs every minute - sweeps unacknowledged P0s and fires +5 min push /
  # +10 min voice call per the routing rules YAML.
  - type: cron
    name: apteker-router-p0-escalate
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "* * * * *"            # every minute
    buildCommand: "pip install -e ."
    startCommand: "python -m app.jobs.p0_escalate --once"
    envVars:
      - key: DB_URL
        fromDatabase:
          name: apteker-router-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: apteker-router-db
    plan: free                # 1 GB; bump to starter ($7/mo) for daily backups
    databaseName: apteker
    user: apteker
    region: oregon
