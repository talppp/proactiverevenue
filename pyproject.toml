[project]
name = "apteker-ai-issue-router"
version = "0.1.0"
description = "Phase I AI Issue Router runtime for Apteker Realty"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars before importing the app (deliberate).
"tests/conftest.py" = ["E402"]
# seed script bootstraps sys.path before importing app.*.
"scripts/seed_database.py" = ["E402"]
# verify_e2e is a script using REPO_ROOT before importing.
"scripts/verify_e2e.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
